<!DOCTYPE html>
<html lang="en" data-shell-theme="fluid">
<head>
    <meta charset="UTF-8">
    <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" id="theme-color-meta">
    <meta name="referrer" content="no-referrer">

    <!-- 阻塞渲染：统一主题初始化，防 FOUC -->
    <script>
      (function(){
        var shellColors={light:'#ffffff',dark:'#09090b'};
        function applyTheme(t){
          var root=document.documentElement;
          var meta=document.getElementById('theme-color-meta');
          if(t==='dark'){
            root.classList.add('dark');
            root.style.colorScheme='dark';
            if(meta)meta.setAttribute('content',shellColors.dark);
          }else{
            root.classList.remove('dark');
            root.style.colorScheme='light';
            if(meta)meta.setAttribute('content',shellColors.light);
          }
        }
        function getTheme(){
          try{
            var s=localStorage.getItem('theme_pref');
            if(!s)return null;
            var d=JSON.parse(s);
            if((d.value==='dark'||d.value==='light')&&(!d.expires||d.expires>Date.now()))return d.value;
            localStorage.removeItem('theme_pref');
          }catch(e){try{localStorage.removeItem('theme_pref');}catch(_){} }
          return null;
        }
        var t=getTheme()||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
        applyTheme(t);
      })();
    </script>

    <title>FlareTune</title>
    <meta name="description" content="FlareTune is a self-hosted audio streaming app for individuals and families.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FlareTune">
    <meta property="og:title" content="FlareTune">
    <meta property="og:description" content="FlareTune is a self-hosted audio streaming app for individuals and families.">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="FlareTune">
    <meta name="twitter:description" content="FlareTune is a self-hosted audio streaming app for individuals and families.">

    <link rel="icon" type="image/png" href="/favicon.png" sizes="512x512">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- Google Fonts: existing Inter request; editorial headings use the local system serif stack -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
