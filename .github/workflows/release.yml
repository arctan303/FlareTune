name: Publish release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false
      - name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            git fetch origin main --no-tags
            git merge-base --is-ancestor HEAD origin/main
            test "$(git cat-file -t "$RELEASE_TAG")" = tag
          else
            RELEASE_TAG=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json","utf8")).version')
          fi
          node tooling/release/prepare-notes.mjs --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist-css
      - run: npm run verify:i18n
      - name: Smoke test isolated Worker
        run: node tooling/dev/preview-worker.mjs --smoke

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Confirm immutable tag and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          remote_commit=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | sort -k2 | tail -n1 | cut -f1)
          test "$remote_commit" = "$(git rev-parse HEAD)"
          node tooling/release/prepare-notes.mjs --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease >"$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            node --input-type=module -e 'import {readFileSync} from "node:fs"; const r=JSON.parse(readFileSync(process.argv[1],"utf8")); if(r.tagName!==process.env.RELEASE_TAG||r.isDraft||r.isPrerelease) throw new Error("Existing release is not the expected stable release");' "$RUNNER_TEMP/existing-release.json"
            echo "Release already exists; preserving its contents."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "FlareTune $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
