name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated main tag to release without moving it
        required: true
        type: string
  pull_request:
    branches:
      - main
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate recovery input
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false
      - name: Validate tag and release notes
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node tooling/release/prepare-notes.mjs --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main "refs/tags/$RELEASE_TAG:refs/release-candidate"
            test "$(git cat-file -t refs/release-candidate)" = tag
            test "$(git rev-parse 'refs/release-candidate^{}')" = "$(git rev-parse HEAD)"
            git merge-base --is-ancestor HEAD origin/main
          else
            RELEASE_TAG=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json","utf8")).version')
            node tooling/release/prepare-notes.mjs --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist-css
      - run: npm run verify:i18n
      - name: Smoke test isolated Worker
        run: node tooling/dev/preview-worker.mjs --smoke

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Confirm immutable tag and prepare notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main "refs/tags/$RELEASE_TAG:refs/release-candidate"
          test "$(git cat-file -t refs/release-candidate)" = tag
          test "$(git rev-parse 'refs/release-candidate^{}')" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          node tooling/release/prepare-notes.mjs --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease >"$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            node --input-type=module -e 'import {readFileSync} from "node:fs"; const r=JSON.parse(readFileSync(process.argv[1],"utf8")); if(r.tagName!==process.env.RELEASE_TAG||r.isDraft||r.isPrerelease) throw new Error("Existing release is not the expected stable release");' "$RUNNER_TEMP/existing-release.json"
            echo "Release already exists; preserving its contents."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "FlareTune $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
