# Advanced migration profile. Copy this file to an ignored local path and
# replace every REQUIRED_* value after independently verifying the target.
# Never use this profile for a fresh FlareTune installation.
name = "REQUIRED_NEW_FLARETUNE_WORKER_NAME"
main = "src/flaretune.js"
compatibility_date = "2026-09-23"
workers_dev = true
preview_urls = true

[assets]
directory = "../dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api", "/api/*", "/auth", "/auth/*", "/media", "/media/*"]

[vars]
MEDIA_PREFIX = "REQUIRED_EXISTING_R2_PREFIX"

[[d1_databases]]
binding = "DB"
database_name = "REQUIRED_NEW_FLARETUNE_D1_NAME"
database_id = "REQUIRED_NEW_FLARETUNE_D1_ID"
migrations_dir = "db/migrations-flaretune"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "REQUIRED_EXISTING_R2_BUCKET_NAME"
