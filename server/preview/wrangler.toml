name = "flaretune-preview"
main = "../src/flaretune.js"
compatibility_date = "2026-09-23"

[assets]
directory = "../../dist"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*", "/auth", "/auth/*", "/media", "/media/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
MEDIA_PREFIX = "media"

[[d1_databases]]
binding = "DB"
database_name = "flaretune-preview"
database_id = "a2c00000-0000-4000-8000-000000000581"
migrations_dir = "../db/migrations-flaretune"
remote = false

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "flaretune-preview-media"
remote = false
