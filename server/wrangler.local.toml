name = "flaretune-local"
main = "src/flaretune.js"
compatibility_date = "2026-09-23"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[kv_namespaces]]
binding = "YTM_KV"
id = "00000000000000000000000000000006"

[durable_objects]
bindings = [{ name = "YTM_RUNTIME", class_name = "YouTubeRuntime" }]

[[migrations]]
tag = "yt-runtime-v1"
new_sqlite_classes = ["YouTubeRuntime"]

[vars]
MEDIA_PREFIX = "media"

# Local bindings persist only under worker/.wrangler/state.
[[d1_databases]]
binding = "DB"
database_name = "flaretune-local"
database_id = "a2c00000-0000-4000-8000-000000000501"
migrations_dir = "db/migrations-flaretune"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "flaretune-local-media"
