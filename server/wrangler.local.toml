name = "flaretune-local"
main = "src/flaretune.js"
compatibility_date = "2026-09-23"

[vars]
CORS_ORIGINS = "http://localhost:5173, http://127.0.0.1:5173, http://localhost:3000, http://127.0.0.1:3000"
MUSIC_WEB_ORIGIN = "http://127.0.0.1:3000"
MEDIA_PREFIX = "media"

# Local bindings persist only under worker/.wrangler/state.
[[d1_databases]]
binding = "DB"
database_name = "flaretune-local"
database_id = "a2c00000-0000-4000-8000-000000000501"
migrations_dir = "db/migrations-flaretune"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "flaretune-local-media"
