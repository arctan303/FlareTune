name = "flaretune"
main = "server/src/flaretune.js"
compatibility_date = "2026-09-23"
workers_dev = true
preview_urls = true

[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/auth", "/auth/*", "/media", "/media/*"]

[vars]
MEDIA_PREFIX = "media"

# Deploy to Cloudflare provisions these resources for each installation.
[[d1_databases]]
binding = "DB"
database_name = "flaretune-db"
database_id = ""
migrations_dir = "server/db/migrations-flaretune"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "flaretune-media"
