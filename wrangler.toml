name = "flaretune"
main = "server/src/flaretune.js"
compatibility_date = "2026-09-23"
workers_dev = true
preview_urls = true

# Subsonic token/salt parameters are replayable credentials; omit raw URL logs.
[observability.logs]
enabled = true
invocation_logs = false

[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/auth", "/auth/*", "/media", "/media/*", "/rest", "/rest/*"]

[vars]
MEDIA_PREFIX = "media"

# Deploy to Cloudflare provisions these resources for each installation.
[[d1_databases]]
binding = "DB"
database_name = "flaretune-db"
database_id = ""
migrations_dir = "server/db/migrations-flaretune"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "flaretune-media"

# Maintainer CI environment. The D1 ID is supplied only by Cloudflare Builds.
# Cloudflare deploys flaretune-dev with: npm run deploy:dev:ci
[env.dev]
workers_dev = true
preview_urls = false

[env.dev.observability]
enabled = true
head_sampling_rate = 1

[env.dev.observability.logs]
invocation_logs = false

[env.dev.vars]
MEDIA_PREFIX = "dist_music"
MUSIC_WEB_ORIGIN = "http://127.0.0.1:3000"
CORS_ORIGINS = "http://127.0.0.1:3000,http://localhost:3000"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "flaretune-db-dev"
database_id = "__FLARETUNE_DEV_D1_ID__"
migrations_dir = "server/db/migrations-flaretune"

[[env.dev.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "flaretune-files-dev"
